apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb-infrastructure
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ingeniousideas/TS_streamView_INFRA_CD.git # Replace with your GitHub username
    targetRevision: HEAD
    path: metallb # Points ArgoCD exclusively to this folder
  destination:
    server: https://kubernetes.default.svc
    namespace: metallb-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true